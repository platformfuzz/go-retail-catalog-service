name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
      - ".devcontainer/**"

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write
  statuses: write
  packages: write

jobs:
  golangci-lint:
    uses: actionsforge/actions-golangci-lint/.github/workflows/golangci-lint.yml@v0

  govulncheck:
    uses: actionsforge/actions-govulncheck/.github/workflows/govulncheck.yml@v0

  test:
    uses: actionsforge/actions-go-test/.github/workflows/go-test.yml@v0
    with:
      test-pattern: "./..."

  validate:
    uses: actionsforge/actions/.github/workflows/go-mod-tidy-build.yml@main
    with:
      go-version: "1.25"
      build-command: go build -v -o bin/catalog-service main.go

  validate-image:
    uses: actionsforge/actions/.github/workflows/docker-image-validate.yml@main
    with:
      image-tag: "retail-catalog-service:test"
      # Match prior CI: prove the image builds; Trivy stays opt-in until the base is hardened.
      scan-enabled: false

  build-and-push:
    needs: [validate, validate-image, test, golangci-lint, govulncheck]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      packages: write
    uses: actionsforge/actions/.github/workflows/docker-image-release.yml@main
    with:
      # Tag releases still publish Go binaries via the release job below.
      create-release: false
    secrets: inherit

  release:
    needs: [validate, validate-image, test, golangci-lint, govulncheck]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: actionsforge/actions/.github/workflows/go-binary-release.yml@main
    with:
      go-version: "1.25"
      binary-name: catalog-service
      package: main.go
    secrets: inherit
